<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" role="img" aria-label="AgentHack Council Architecture Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a0f"/>
      <stop offset="55%" stop-color="#0c121d"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Header -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="236" height="28" rx="14" fill="#18152e" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="16" y="18" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">⚡ ZERO RUNTIME DEPS · SARIF 2.1</text>

    <text x="0" y="76" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">AgentHack Council</text>
    <text x="0" y="110" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Inter, Segoe UI, sans-serif" font-size="18">Adversarial AI Security Harness for Coding Agents, MCP Servers &amp; SKILL.md</text>
  </g>

  <!-- Pipeline Flow Cards -->
  <!-- Stage 1 -->
  <g transform="translate(56, 200)">
    <rect width="248" height="132" rx="10" fill="#0e1521" stroke="#334155" stroke-width="1.5"/>
    <rect width="248" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="18" y="28" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">STAGE 1 · &lt;50ms RECON</text>
    <text x="18" y="54" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="700">10 Agent Threat Rules</text>
    <text x="18" y="78" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Unicode &amp; HTML smuggling</text>
    <text x="18" y="96" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• MCP Tool Poisoning</text>
    <text x="18" y="114" fill="#10b981" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">✓ Pre-redacts raw secrets</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 314 266 L 344 266" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="344,261 354,266 344,271" fill="#64748b"/>

  <!-- Stage 2: Advocate + Skeptic -->
  <g transform="translate(362, 200)">
    <rect width="240" height="60" rx="8" fill="#180e16" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="14" y="23" fill="#f43f5e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">🔴 ADVOCATE</text>
    <text x="14" y="43" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="12.5">Builds concrete exploit chain</text>

    <rect y="72" width="240" height="60" rx="8" fill="#0d1826" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="14" y="95" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">🔵 SKEPTIC</text>
    <text x="14" y="115" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="12.5">Challenges docs &amp; test FPs</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 610 230 L 638 256" stroke="#64748b" stroke-width="1.8"/>
  <path d="M 610 302 L 638 276" stroke="#64748b" stroke-width="1.8"/>
  <polygon points="636,261 646,266 636,271" fill="#a78bfa"/>

  <!-- Stage 2b: Judge -->
  <g transform="translate(654, 200)">
    <rect width="234" height="132" rx="10" fill="#131124" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="1.5"/>
    <rect width="234" height="3" rx="1.5" fill="#a78bfa"/>
    <text x="16" y="28" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">⚖️ COUNCIL JUDGE</text>
    <rect x="16" y="42" width="84" height="20" rx="4" fill="#3b121f"/>
    <text x="23" y="56" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">CONFIRMED</text>
    <rect x="106" y="42" width="82" height="20" rx="4" fill="#36260d"/>
    <text x="113" y="56" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">UNCERTAIN</text>
    <rect x="16" y="68" width="114" height="20" rx="4" fill="#0c2e24"/>
    <text x="23" y="82" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="700">DISMISSED (FP)</text>
    <text x="16" y="112" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">+ Minimal Unified Diff</text>
  </g>

  <!-- Arrow 3 -->
  <path d="M 896 266 L 922 266" stroke="#64748b" stroke-width="2"/>
  <polygon points="922,261 932,266 922,271" fill="#f43f5e"/>

  <!-- Stage 3: Canary Prover -->
  <g transform="translate(940, 200)">
    <rect width="204" height="132" rx="10" fill="#0e1521" stroke="#334155" stroke-width="1.5"/>
    <rect width="204" height="3" rx="1.5" fill="#f43f5e"/>
    <text x="16" y="28" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">STAGE 3 · --PROVE</text>
    <text x="16" y="54" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="15" font-weight="700">Canary Sandbox</text>
    <text x="16" y="78" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Synthetic .env / SSH</text>
    <text x="16" y="96" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• 127.0.0.1 HTTP trap</text>
    <text x="16" y="114" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">• Web UI + SARIF 2.1</text>
  </g>
</svg>
