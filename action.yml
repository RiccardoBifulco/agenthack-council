name: 'AgentHack Council Scan'
description: 'Adversarial AI Security Harness (Advocate -> Skeptic -> Judge) for AI Agents, MCP configs, and SKILL.md files'
author: 'Riccardo Bifulco'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  council:
    description: 'Council mode: auto | llm | heuristic | off'
    required: false
    default: 'auto'
  provider:
    description: 'Optional LLM provider (anthropic | openai | gemini | openrouter | ollama)'
    required: false
    default: ''
  prove:
    description: 'Run canary sandbox proof on confirmed findings'
    required: false
    default: 'true'
  sarif-file:
    description: 'Optional output path for SARIF 2.1.0 report (for GitHub Code Scanning)'
    required: false
    default: ''
  fail-on-confirmed:
    description: 'Exit with code 1 when confirmed exploitable findings are detected'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Build AgentHack Council
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build
    - name: Run Adversarial Council Audit
      shell: bash
      run: |
        ARGS=("${{ inputs.path }}" "--council" "${{ inputs.council }}")
        if [ -n "${{ inputs.provider }}" ]; then
          ARGS+=("--provider" "${{ inputs.provider }}")
        fi
        if [ "${{ inputs.prove }}" = "true" ]; then
          ARGS+=("--prove")
        fi
        if [ -n "${{ inputs.sarif-file }}" ]; then
          ARGS+=("--sarif" "--output" "${{ inputs.sarif-file }}")
        fi
        if [ "${{ inputs.fail-on-confirmed }}" = "true" ]; then
          ARGS+=("--fail-on-confirmed")
        fi
        node "${{ github.action_path }}/dist/src/cli.js" "${ARGS[@]}"
