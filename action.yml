name: 'AgentHack Council Scan'
description: 'Adversarial AI Security Harness (Advocate -> Skeptic -> Judge) for AI Agents, MCP configs, and SKILL.md files'
author: 'Riccardo Bifulco'
branding:
  icon: 'shield'
  color: 'purple'
inputs:
  path:
    description: 'Path to scan'
    required: false
    default: '.'
  council:
    description: 'Council mode: auto | llm | heuristic | off (auto is offline without a provider choice)'
    required: false
    default: 'auto'
  provider:
    description: 'Optional LLM provider (anthropic | openai | gemini | openrouter | ollama)'
    required: false
    default: ''
  prove:
    description: 'Include static evidence annotations on Council-confirmed findings'
    required: false
    default: 'true'
  sarif-file:
    description: 'Optional output path for SARIF 2.1.0 report (for GitHub Code Scanning)'
    required: false
    default: ''
  fail-on-confirmed:
    description: 'Exit with code 1 when the Council confirms findings'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Build AgentHack Council
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci && npm run build
    - name: Run Adversarial Council Audit
      shell: bash
      env:
        AHC_PATH: ${{ inputs.path }}
        AHC_COUNCIL: ${{ inputs.council }}
        AHC_PROVIDER: ${{ inputs.provider }}
        AHC_PROVE: ${{ inputs.prove }}
        AHC_SARIF_FILE: ${{ inputs.sarif-file }}
        AHC_FAIL_ON_CONFIRMED: ${{ inputs.fail-on-confirmed }}
      run: |
        set -euo pipefail
        for value in "$AHC_PROVE" "$AHC_FAIL_ON_CONFIRMED"; do
          case "$value" in
            true|false) ;;
            *) echo "Expected a boolean action input (true or false)." >&2; exit 2 ;;
          esac
        done
        args=(--council "$AHC_COUNCIL")
        if [[ -n "$AHC_PROVIDER" ]]; then
          args+=(--provider "$AHC_PROVIDER")
        fi
        if [[ "$AHC_PROVE" == true ]]; then
          args+=(--prove)
        fi
        if [[ -n "$AHC_SARIF_FILE" ]]; then
          args+=(--sarif --output "$AHC_SARIF_FILE")
        fi
        if [[ "$AHC_FAIL_ON_CONFIRMED" == true ]]; then
          args+=(--fail-on-confirmed)
        fi
        node "$GITHUB_ACTION_PATH/dist/src/cli.js" "${args[@]}" -- "$AHC_PATH"
