name: CI & Self-Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run demo
      - run: npm run self-audit

  code-scanning:
    name: SARIF Self-Audit (GitHub Security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Prepare a composite-action smoke test
        run: |
          mkdir 'action smoke'
          printf '# Local agent guidelines\n' > 'action smoke/AGENTS.md'
      - name: Run the composite action
        uses: ./
        with:
          path: 'action smoke'
          council: 'heuristic'
          prove: 'false'
          sarif-file: 'action smoke/report.sarif'
      - name: Verify the composite-action report
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const report = JSON.parse(fs.readFileSync("action smoke/report.sarif", "utf8")); if (report.runs[0].properties.coverage !== "complete") process.exit(1)'
      - name: Generate SARIF 2.1.0 Report
        run: node dist/src/cli.js . --council heuristic --prove --sarif --output agenthack-council.sarif --fail-on-policy
      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && hashFiles('agenthack-council.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: agenthack-council.sarif
