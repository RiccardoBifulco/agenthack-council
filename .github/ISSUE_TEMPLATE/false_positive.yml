name: ⚖️ False Positive / Scanner Bypass
description: Report a benign snippet flagged as CONFIRMED or a malicious agent payload missed by Stage 1/2
title: "[Tuning]: "
labels: ["rule-tuning"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Tuning Type
      options:
        - False Positive (Benign file marked CONFIRMED instead of DISMISSED/UNCERTAIN)
        - False Negative / Bypass (Malicious payload missed)
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID (if applicable)
      placeholder: AHC-003
  - type: dropdown
    id: category
    attributes:
      label: Target File Category
      options:
        - skill-markdown (SKILL.md)
        - mcp-config (.mcp.json / claude_desktop_config.json)
        - mcp-server-code (.ts / .py / .go)
        - agent-instructions (CLAUDE.md / .cursorrules / .mdc)
        - agent-settings (settings.json)
        - agent-hook (hooks/*)
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Sanitized Reproduction Snippet
      description: Minimal anonymized snippet reproducing the false positive or bypass.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Council Verdict & Rationale
      placeholder: Skeptic should recognize that this snippet is inside a fenced documentation anti-pattern block...
    validations:
      required: true
